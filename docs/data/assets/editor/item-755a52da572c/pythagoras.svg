<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270"><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1e293b;font-size:15px} .sub{font-size:12px;fill:#64748b}.strong{font-weight:700}.wire{stroke:#334155;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.blue{stroke:#0284c7;fill:none;stroke-width:3}.orange{stroke:#ea580c;fill:none;stroke-width:3}</style><rect x="1" y="1" width="678" height="268" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="27" y="32" class="strong">Trójkąt prostokątny</text><path d="M157 205 L157 56 L394 205 Z" fill="#dbeafe" stroke="#0369a1" stroke-width="3"/><path d="M157 181 H181 V205" stroke="#334155" stroke-width="2" fill="none"/><text x="131" y="130" class="">a</text><text x="273" y="227" class="">b</text><text x="287" y="118" class="">c</text><text x="355" y="193" class="">α</text><text x="447" y="116" class="strong">a² + b² = c²</text><text x="446" y="147" class="sub">sin α = a / c</text><text x="446" y="170" class="sub">cos α = b / c</text></svg>