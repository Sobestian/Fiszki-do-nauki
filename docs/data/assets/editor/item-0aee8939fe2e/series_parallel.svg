<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270"><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1e293b;font-size:15px} .sub{font-size:12px;fill:#64748b}.strong{font-weight:700}.wire{stroke:#334155;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.blue{stroke:#0284c7;fill:none;stroke-width:3}.orange{stroke:#ea580c;fill:none;stroke-width:3}</style><rect x="1" y="1" width="678" height="268" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="34" y="30" class="strong">Połączenie szeregowe</text><text x="357" y="30" class="strong">Połączenie równoległe</text><path d="M40 102 H77 M146 102 H179 M248 102 H309" class="wire"/><rect x="77" y="89" width="69" height="26" rx="3" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><rect x="179" y="89" width="69" height="26" rx="3" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="90" y="82" class="">R₁</text><text x="191" y="82" class="">R₂</text><text x="57" y="147" class="sub">Ten sam prąd w obu rezystorach.</text><path d="M375 90 H406 V183 H375 M406 112 H475 M542 112 H613 M613 112 V183 H542 M475 183 H542 M406 183 H375" class="wire"/><rect x="475" y="99" width="67" height="26" rx="3" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><rect x="475" y="170" width="67" height="26" rx="3" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="493" y="93" class="">R₁</text><text x="493" y="165" class="">R₂</text><text x="367" y="234" class="sub">To samo napięcie na obu gałęziach.</text></svg>